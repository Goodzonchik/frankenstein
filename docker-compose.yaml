networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16

services:
  minio:
    image: minio/minio:latest
    container_name: file-storage-db
    command: server --console-address ":9001" /data/
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    expose:
      - "9000"
    ports:
      - "9001:9001"
    volumes:
      - minio-storage:/data
    networks:
      default:
        ipv4_address: 172.18.0.2

  minio-init:
    build: ./minio-init
    container_name: minio-init
    networks:
      default:
        ipv4_address: 172.18.0.10
    depends_on:
      minio:
        condition: service_started

  neo4j:
    image: neo4j:5.23.0
    container_name: graph-db
    expose:
      - "7474"
    environment:
      - "NEO4J_AUTH=none"
    volumes:
      - neo4jdata:/data
    networks:
      default:
        ipv4_address: 172.18.0.3

  reverse-proxy:
    image: nginx
    container_name: reverse-proxy
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    networks:
      default:
        ipv4_address: 172.18.0.4
    depends_on:
      graph-db-service:
        condition: service_started
      postgres-db-service:
        condition: service_started
      file-storage:
        condition: service_started

  file-storage:
    image: node:18
    container_name: file-storage-service
    volumes:
      - ./file-storage-service/:/app
      - ./node_modules:/app/node_modules
    working_dir: /app
    command: node dist/main.js
    expose:
      - "3001"
    networks:
      default:
        ipv4_address: 172.18.0.5
    depends_on:
      minio:
        condition: service_started

  graph-db-service:
    image: node:18
    container_name: graph-db-service
    volumes:
      - ./graph-db-service/:/app
      - ./node_modules:/app/node_modules
    working_dir: /app
    command: node dist/main.js
    expose:
      - "3000"
    networks:
      default:
        ipv4_address: 172.18.0.6
    depends_on:
      neo4j:
        condition: service_started

  postgres:
    image: postgres
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: frankenstein
      POSTGRES_USER: victor
      POSTGRES_PASSWORD: victor
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      default:
        ipv4_address: 172.18.0.7

  postgres-adminer:
    image: adminer
    container_name: postgres-adminer
    restart: always
    ports:
      - "8282:8282"
    command:
      - "php"
      - "-S"
      - "[::]:8282"
      - "-t"
      - "/var/www/html"
    networks:
      default:
        ipv4_address: 172.18.0.8
    depends_on:
      postgres:
        condition: service_started

  postgres-db-service:
    image: node:18
    container_name: postgres-db-service
    volumes:
      - ./postgres-db-service/:/app
      - ./node_modules:/app/node_modules
    working_dir: /app
    command: node dist/main.js
    expose:
      - "3000"
    networks:
      default:
        ipv4_address: 172.18.0.9
    depends_on:
      postgres:
        condition: service_started

volumes:
  minio-storage:
  neo4jdata:
  pgdata:
