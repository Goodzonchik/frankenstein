<h3>Files from {{ bucket() }} <button (click)="goBack()">go back</button></h3>

<table class="table">
  <thead>
    <tr>
      <th>name</th>
      <th>lastModified</th>
      <th>size</th>
      <th>#</th>
    </tr>
  </thead>
  <tbody>
    @for(file of files(); track file) {
    <tr (click)="openPreview(file.name)">
      <td>{{ file.name }}</td>
      <td>{{ file.lastModified | date }}</td>
      <td>{{ file.size }}</td>
      <td>
        <button (click)="$event.stopPropagation(); downloadFile(file.name)">download</button>
        <button (click)="$event.stopPropagation(); deleteFile(file.name)">delete</button>
      </td>
    </tr>
    }
  </tbody>
</table>

<br /><br />
<div class="form-group">
  <label for="file">Choose File</label>
  <input type="file" id="file" (change)="handleFileInput($event)" />

  <button (click)="uploadFileToActivity()">uploadFileToActivity</button>
</div>

<app-image-viewer
  [imageUrl]="previewImageUrl()"
  [visible]="isViewerVisible()"
  (closed)="closePreview()"
></app-image-viewer>
